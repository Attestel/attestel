; Runs all 12 application processes in one container. Internal ports:
;   analysis 8001 · llm 8002 · prediction 8003 · events 8004 · gateway 8181
;   alerts 8095 · journal 8096 · paper 8097 · feedback 8098 · auth 8099 · nginx $PORT (public)
; User-supplied config (LLM_API_KEY, price/news keys, TICKERS, SMTP_*, ...) is inherited from the
; container environment. Per-service PORT and the localhost service URLs are pinned here.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
loglevel=info

; The control socket + RPC interface exist so `supervisorctl status` works. entrypoint.sh dumps that
; status when the startup gate times out, which is the difference between "some service never came
; up" and knowing which one and in what state.
[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; fatalwatch turns "supervisord gave up on a program" into "the container exits", so the orchestrator
; restarts the pod instead of routing traffic to an image running ten of its eleven services. FATAL is
; reached only after a program burns all `startretries` below, so this is not a hair trigger — and a
; experiment-critical services deliberately fail closed when their configured PostgreSQL store
; cannot be opened; FATAL then restarts the whole pod rather than allowing disposable file state.
[eventlistener:fatalwatch]
command=python3 /app/deploy/fatalwatch.py
events=PROCESS_STATE_FATAL
autorestart=true
priority=1
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; analysis + prediction get --limit-max-requests: uvicorn finishes in-flight requests, exits, and
; supervisor restarts it — a periodic memory recycle for the churn-heavy pandas services (the
; gateway fails soft on cached data during the ~5s restart). llm is exempt on purpose: its
; committee/brief calls are long-running and rare, so recycling would hurt more than help.
[program:analysis]
directory=/app/services/analysis
command=uvicorn app.main:app --host 127.0.0.1 --port 8001 --limit-max-requests 2000
priority=10
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:llm]
directory=/app/services/llm
command=uvicorn app.main:app --host 127.0.0.1 --port 8002
environment=ANALYSIS_URL="http://127.0.0.1:8001",EVENTS_URL="http://127.0.0.1:8004"
priority=10
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:prediction]
directory=/app/services/prediction
command=uvicorn app.main:app --host 127.0.0.1 --port 8003 --limit-max-requests 1000
environment=ANALYSIS_URL="http://127.0.0.1:8001",LLM_URL="http://127.0.0.1:8002",EVENTS_URL="http://127.0.0.1:8004"
priority=10
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Completed-bar-driven immutable challenger training + the existing parameter-free price evaluator.
; OFF by default. It never imports a deployment operation, never calls Qwen, and cannot promote or
; reset the paper book. PostgreSQL leases/trials make restarts and duplicate replicas observable.
[program:prediction-automation]
directory=/app/services/prediction
command=python -m app.autonomy
priority=15
autorestart=unexpected
exitcodes=0
startsecs=0
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:events]
directory=/app/services/events
command=uvicorn app.main:app --host 127.0.0.1 --port 8004
environment=ANALYSIS_URL="http://127.0.0.1:8001",JOURNAL_URL="http://127.0.0.1:8096"
priority=10
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Production clock for model-free events lanes only. With PRODUCTION_SCHEDULER_ENABLED=false (the
; default) it exits 0 and stays EXITED; startsecs=0 makes that an expected state rather than FATAL.
; When enabled it dispatches only ingest/reactions/scout-intake/scout/opportunity-radar. PostgreSQL cadences and
; leases prevent duplicate work. The model worker is not imported and cannot be reached here.
[program:events-scheduler]
directory=/app/services/events
command=python -m app.production_scheduler
priority=15
autorestart=unexpected
exitcodes=0
startsecs=0
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:gateway]
directory=/app
command=/app/bin/gateway
environment=PORT="8181",ANALYSIS_URL="http://127.0.0.1:8001",LLM_URL="http://127.0.0.1:8002",PREDICTION_URL="http://127.0.0.1:8003",EVENTS_URL="http://127.0.0.1:8004",JOURNAL_URL="http://127.0.0.1:8096"
priority=20
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:alerts]
directory=/app
command=/app/bin/alerts
environment=PORT="8095",ANALYSIS_URL="http://127.0.0.1:8001",GATEWAY_URL="http://127.0.0.1:8181"
priority=30
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:journal]
directory=/app
command=/app/bin/journal
environment=PORT="8096",ANALYSIS_URL="http://127.0.0.1:8001",GATEWAY_URL="http://127.0.0.1:8181"
priority=30
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:paper]
directory=/app
command=/app/bin/paper
environment=PORT="8097",PREDICTION_URL="http://127.0.0.1:8003",ANALYSIS_URL="http://127.0.0.1:8001",JOURNAL_URL="http://127.0.0.1:8096"
priority=30
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:feedback]
directory=/app
command=/app/bin/feedback
environment=PORT="8098"
priority=30
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Accounts: local user store + HMAC session cookies. Same-origin behind nginx (/svc/auth), so no
; CORS is needed in prod. AUTH_SECRET (must match gateway/journal/alerts/llm), USERS_DIR, and the
; optional GOOGLE_CLIENT_ID/CORS_ORIGINS are inherited from the container environment.
[program:auth]
directory=/app
command=/app/bin/auth
environment=PORT="8099"
priority=30
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=nginx -c /etc/nginx/nginx.conf -g "daemon off;"
priority=40
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
